<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080711">
  <title>love u ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header class="intro">
    <p class="eyebrow">a little place for us</p>
    <h1>love u <span>♡</span></h1>
    <p class="sub">click a memory</p>
  </header>

  <section class="memories" aria-label="Unsere Erinnerungen">
<button class="memory memory-1" data-story="0"><img src="assets/memory-5.png" alt="Pixelart-Erinnerung"><span>♡</span></button>
<button class="memory memory-2" data-story="1"><img src="assets/memory-1.png" alt="Pixelart-Erinnerung"><span>✦</span></button>
<button class="memory memory-3" data-story="2"><img src="assets/memory-2.png" alt="Pixelart-Erinnerung"><span>♡</span></button>
<button class="memory memory-4" data-story="3"><img src="assets/memory-3.png" alt="Pixelart-Erinnerung"><span>✦</span></button>
<button class="memory memory-5" data-story="4"><img src="assets/memory-4.png" alt="Pixelart-Erinnerung"><span>♡</span></button>
    
    
    
    
    
  </section>

  <div class="sybau sybau-1">sybau</div>
  <div class="sybau sybau-2">sybau</div>
  <div class="sybau sybau-3">sybau</div>

  <footer>there for you <span>♡</span></footer>
</main>

<div class="story-modal" id="storyModal" aria-hidden="true">
  <div class="story-backdrop" data-close></div>
  <article class="story-card" role="dialog" aria-modal="true">
    <button class="close" data-close aria-label="Schließen">×</button>
    <img id="storyImage" src="" alt="">
    <div class="story-copy">
      <span class="story-number" id="storyNumber"></span>
      <h2 id="storyTitle"></h2>
      <p id="storyText"></p>
      <span class="story-heart">♡</span>
    </div>
  </article>
</div>

<script src="script.js"></script>
</body>
</html>
